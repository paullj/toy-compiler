name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled main run would skip its Pages deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The backend emits arm64 macOS Mach-O executables and ad-hoc code-signs them;
# the run/emit tests SkipZigTest on anything but macos+aarch64. Every job therefore
# runs on an Apple-Silicon macOS runner, or the whole backend would silently no-op.
# Tools come from mise (pinned in mise.toml).
jobs:
  test:
    name: Zig tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-test-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-test-${{ runner.os }}-
      # Unit, cli, lsp and integration suites; integration includes the tests/corpora
      # harness and the tree-sitter grammar agreement test.
      - name: Tests
        run: zig build test --summary all

  fuzz:
    name: Bounded fuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-fuzz-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-fuzz-${{ runner.os }}-
      # Seeded + bounded (FUZZ_SEED / FUZZ_ITERS), so the run terminates fast and
      # reproducibly. Forced to Debug by build.zig so the parser invariants fire.
      - name: Front-end fuzzer
        run: zig build fuzz
        env:
          FUZZ_SEED: "1"
          FUZZ_ITERS: "5000"

  lint:
    name: fmt + release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-lint-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-lint-${{ runner.os }}-
      - name: Format check
        run: zig fmt --check packages build.zig build.zig.zon
      - name: Release build
        run: zig build -Doptimize=ReleaseFast

  site:
    name: Docs site (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-site-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-site-${{ runner.os }}-
      # Run once here; the site:test / site:e2e tasks would each rebuild it.
      - name: Build wasm language server
        run: mise run site:wasm
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: End-to-end tests
        run: pnpm e2e
      # After e2e: its preview build has no base path and would overwrite this one.
      - name: Build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/build

  pages:
    name: Deploy docs site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, fuzz, lint, site]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
