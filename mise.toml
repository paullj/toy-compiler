[tools]
zig = "latest"

# `<verb>:<mode>`: <verb> is the toy subcommand (build = compile; run = compile +
# execute), <mode> is the toolchain used to build the toy compiler itself. Pass the
# input file (and any flags) after the task name, e.g. `mise run run:release main.toy`.
# These build the compiler then invoke the binary DIRECTLY (not via `zig build run`),
# so `run`'s exit-code passthrough surfaces cleanly instead of as a zig "build failed".
[tasks."toy:debug"]
description = "Run toy cli in debug"
run = "zig build && ./zig-out/bin/toy"

[tasks."toy:release"]
description = "Run toy cli in release"
run = "zig build -Doptimize=ReleaseFast && ./zig-out/bin/toy"

# Regenerate the checked-in tree-sitter-toy parser.c from grammar.js. Needed ONLY after
# editing the grammar; the checked-in parser.c is authoritative and the build never needs
# the tree-sitter CLI. Requires tree-sitter CLI 0.26.x (matching the committed parser.c).
[tasks."ts:generate"]
description = "Regenerate the checked-in tree-sitter-toy parser.c from grammar.js"
dir = "packages/tree-sitter-toy"
run = "tree-sitter generate"

# The docs site's editors run the language server in the browser, built from this tree.
# -Oz shrinks zig's output further; the feature flags match what zig emits for wasm32.
[tasks."site:wasm"]
description = "Build the in-browser language server into the docs site"
dir = "packages/site"
run = [
  "pnpm install",
  "zig build lsp-wasm",
  "pnpm exec wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals ../../zig-out/bin/toy-lsp.wasm -o static/toy-lsp.wasm",
]

[tasks."site:dev"]
description = "Run the docs site dev server"
dir = "packages/site"
depends = ["site:wasm"]
run = "pnpm dev"

[tasks."site:test"]
description = "Test the docs site (incl. the wasm language server)"
dir = "packages/site"
depends = ["site:wasm"]
run = "pnpm test"

[tasks."site:e2e"]
description = "Drive the built docs site in headless Chromium (editors + language server)"
dir = "packages/site"
depends = ["site:wasm"]
run = "pnpm e2e"

[tasks."site:build"]
description = "Build the static docs site into packages/site/build"
dir = "packages/site"
depends = ["site:wasm"]
run = "pnpm build"
